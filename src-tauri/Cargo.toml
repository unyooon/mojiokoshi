[package]
name = "mojiokoshi"
version = "0.1.0"
description = "Real-time meeting transcription + AI analysis"
authors = ["Anemonet"]
edition = "2021"

[lib]
name = "mojiokoshi_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
specta = "2.0.0-rc"
specta-typescript = "0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
screencapturekit = "1.5"
ort = "2.0.0-rc"
ndarray = "0.17"
whisper-rs = "0.13"
hf-hub = "0.4"
log = "0.4"
env_logger = "0.11"
printpdf = "0.7"

[dev-dependencies]
mockall = "0.13"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
